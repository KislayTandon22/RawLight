<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17191d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LightCraft">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LightCraft iPad (fork)</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./lightcraft-icon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="description" content="LightCraft: open-source photo library and raw developer, running in your browser (WASM).">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1c1c; overscroll-behavior: none; }
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
    canvas#lightcraft_canvas { position: absolute; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right)); height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom)); display: block; touch-action: none; }
    #lightcraft_loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #b8b8b8; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; pointer-events: none;
    }
    #lightcraft_status { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <canvas id="lightcraft_canvas"></canvas>
  <div id="lightcraft_loading">Loading LightCraft…</div>
  <div id="lightcraft_status" aria-live="polite"></div>
  <script type="module">
    import init, { start, command } from "./lightcraft_web.js";
    (async () => {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./service-worker.js", { scope: "./" }).catch(e => console.warn("PWA offline shell unavailable", e));
      }
      // The Chinese font is a separate file: embedding it would exceed the host's WASM size limit.
      // Font-free development builds can still run, with the same missing-glyph warning as before.
      const chineseFont = fetch("./lightcraft_zh_hans.otf")
        .then(async response => response.ok ? new Uint8Array(await response.arrayBuffer()) : new Uint8Array())
        .catch(() => new Uint8Array());
      // Compile once; the render workers (worker.js) instantiate the same compiled module.
      const [module, font] = await Promise.all([
        WebAssembly.compileStreaming(fetch("./lightcraft_web_bg.wasm")),
        chineseFont,
      ]);
      globalThis.lightcraftModule = module;
      await init({ module_or_path: module });
      // automation: `await lightcraft.command("library.info", "{}")` → JSON text
      globalThis.lightcraft = { command };
      start(font);
    })().catch((e) => {
      console.error(e);
      const el = document.getElementById("lightcraft_loading");
      if (el) el.textContent = "LightCraft failed to load: " + e;
    });
  </script>
</body>
</html>
