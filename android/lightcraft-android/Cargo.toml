[package]
name = "lightcraft-android"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
lightcraft-engine = { path = "../../crates/engine" }
lightcraft-ui-egui = { path = "../../crates/ui-egui" }
lightcraft-codecs = { path = "../../crates/codecs" }
lightcraft-raster = { path = "../../crates/raster" }
serde_json = { version = "1", features = ["float_roundtrip"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "android-native-activity"] }
egui = { version = "0.37", default-features = false }
log = "0.4"
android_logger = "0.14"
winit = { version = "0.30", default-features = false }
