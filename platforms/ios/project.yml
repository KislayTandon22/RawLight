name: RawLight
options:
  bundleIdPrefix: com.kislay
  deploymentTarget:
    iOS: "17.5"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
targets:
  RawLight:
    type: application
    platform: iOS
    sources:
      - path: RawLight
    settings:
      base:
        PRODUCT_NAME: RawLight
        PRODUCT_BUNDLE_IDENTIFIER: com.kislay.rawlight
        DEVELOPMENT_TEAM: ZW9T4T3ZDY
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: NO
        ENABLE_DEBUG_DYLIB: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: RawLight
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "RawLight saves the photos you export."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "RawLight imports the photos you pick so you can edit them."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: RawLight/RawLight-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../../crates/bridge/include"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/build"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-force_load"
          - "$(PROJECT_DIR)/build/liblightcraft_bridge.a"
          - "-framework"
          - Metal
          - "-framework"
          - Accelerate
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    preBuildScripts:
      - name: Build Rust bridge
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(PROJECT_DIR)/build/liblightcraft_bridge.a"
        script: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          if [[ "$SDK_NAME" == *simulator* ]]; then T=aarch64-apple-ios-sim; else T=aarch64-apple-ios; fi
          ROOT="${PROJECT_DIR}/../.."
          mkdir -p "${PROJECT_DIR}/build"
          (cd "$ROOT" && cargo build -p lightcraft-bridge --target "$T" --release)
          cp "$ROOT/target/$T/release/liblightcraft_bridge.a" "${PROJECT_DIR}/build/liblightcraft_bridge.a"
  RawLightUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: RawLight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kislay.rawlight.uitests
        DEVELOPMENT_TEAM: ZW9T4T3ZDY
        TEST_TARGET_NAME: RawLight
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RawLight:
    build:
      targets:
        RawLight: all
    test:
      targets:
        - RawLightUITests
