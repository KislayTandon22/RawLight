[package]
name = "lightcraft-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["staticlib"]

[lints]
workspace = true

[dependencies]
lightcraft-engine = { path = "../../crates/engine", features = ["sam"] }
lightcraft-ui-egui = { path = "../../crates/ui-egui" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }
egui = { version = "=0.36.2", default-features = false }
log = "0.4"
