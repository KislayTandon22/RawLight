[package]
name = "lightcraft-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "C ABI over the engine command contract, for native UIs (SwiftUI, Kotlin, ...)"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
lightcraft-engine = { workspace = true, features = ["sam", "denoise", "rawnind-model"] }
serde_json = { workspace = true }
lightcraft-catalog = { workspace = true }
